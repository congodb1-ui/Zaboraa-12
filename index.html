  <body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          if (h === 'zaboraa-12.vercel.app' || h === 'www.zaboraa-12.vercel.app') {
            window.location.replace('https://zaboraa.com' + window.location.pathname + window.location.search + window.location.hash);
            return;
          }
        } catch (e) {}
        try {
          var saved = localStorage.getItem('zaboraa_theme_mode');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light-high-contrast');
          } else {
            document.documentElement.classList.remove('light-high-contrast');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
